- job:
    name: gerrit-mcp-base
    abstract: true
    pre-run: .zuul.d/playbooks/pre.yaml

- job:
    name: gerrit-mcp-check-style
    parent: gerrit-mcp-base
    description: Run Python formatters and linters
    run: .zuul.d/playbooks/check_py_style.yaml

- job:
    name: gerrit-mcp-check-docs-format
    parent: gerrit-mcp-base
    description: Run Markdown format checks
    run: .zuul.d/playbooks/check_md_format.yaml

- job:
    name: gerrit-mcp-run-tests
    parent: gerrit-mcp-base
    description: Run tests
    run: .zuul.d/playbooks/run_tests.yaml

- job:
    name: gerrit-mcp-run-e2e-tests
    parent: gerrit-mcp-base
    description: Run E2E tests against a disposable Gerrit container
    run: .zuul.d/playbooks/run_e2e_tests.yaml
    timeout: 1800

- project:
    description: Run linters, formatters, and tests
    check:
      jobs:
        - gerrit-mcp-check-style
        - gerrit-mcp-check-docs-format
        - gerrit-mcp-run-tests
        - gerrit-mcp-run-e2e-tests
