- job:
    name: gerrit-mcp-sync-py-deps
    description: Ensure python dependencies can be installed
    run: .zuul/playbooks/uv_sync.yaml

- job:
    name: gerrit-mcp-base
    abstract: true
    pre-run: .zuul/playbooks/uv_sync.yaml

- job:
    name: gerrit-mcp-check-style
    parent: gerrit-mcp-base
    description: Run formatters and linters
    run: .zuul/playbooks/check_style.yaml

- job:
    name: gerrit-mcp-run-tests
    parent: gerrit-mcp-base
    description: Run tests
    run: .zuul/playbooks/run_tests.yaml

- project:
    check:
      jobs:
        - gerrit-mcp-sync-py-deps
        - gerrit-mcp-check-style
        - gerrit-mcp-run-tests
